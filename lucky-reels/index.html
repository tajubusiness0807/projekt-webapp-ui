<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lucky Reels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chivo:wght@400;600&display=swap">
<style>
  /* One centered card on the casino felt: the machine is switched off for now. */
  :root {
    --bg: #f3efe6; --card: #fffaf0; --fg: #231a14; --muted: #6d5d50; --accent: #b8321f; --line: #e2d6c4;
    --display: "Bungee", Impact, "Arial Black", sans-serif;
    --body: "Chivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14100d; --card: #1f1915; --fg: #f3e9dc; --muted: #b3a291; --accent: #f0a23a; --line: #3a2f27; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #14100d; --card: #1f1915; --fg: #f3e9dc; --muted: #b3a291; --accent: #f0a23a; --line: #3a2f27; color-scheme: dark }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px;
    box-sizing: border-box;
  }
  main { max-width: 34rem; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px; display: grid; gap: 14px; }
  .reels { display: flex; gap: 8px; }
  .reels span { flex: 1; aspect-ratio: 1; max-width: 72px; border: 1px solid var(--line); border-radius: 8px; display: grid; place-items: center; font-family: var(--display); font-size: 26px; color: var(--muted); }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 7vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--muted); max-width: 60ch; }
</style>
</head>
<body>
<main>
  <div class="reels" aria-hidden="true"><span>–</span><span>–</span><span>–</span></div>
  <p class="eyebrow">Wartungsarbeiten</p>
  <h1>Lucky Reels macht gerade Pause</h1>
  <p>Das Casino ist vorübergehend geschlossen. Eure Konten, Credits, Level und Goodies sind gespeichert und bleiben genau so, wie sie sind.</p>
  <p>Sobald es weitergeht, ist das Spiel wieder unter diesem Link erreichbar.</p>
</main>
</body>
</html>
