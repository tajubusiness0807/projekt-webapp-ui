# Firewall für AllWheel Control (nftables).
# Erlaubt die Weboberfläche nur aus dem Fahrzeug-WLAN (192.168.4.0/24) bzw. einem freigegebenen Netz.
# Installation:
#   sudo cp deployment/networking/nftables-allwheel.conf /etc/nftables.d/ (oder Inhalt in /etc/nftables.conf übernehmen)
#   sudo systemctl enable --now nftables
# SSH (Port 22) bleibt erreichbar – bei Bedarf ebenfalls einschränken.

table inet allwheel {
  set allowed_v4 {
    type ipv4_addr
    flags interval
    elements = { 192.168.4.0/24, 127.0.0.0/8 }
    # Für den Client-WLAN-Modus hier das eigene Netz ergänzen, z. B. 192.168.178.0/24
  }

  chain input {
    type filter hook input priority 0; policy accept;
    tcp dport { 8080, 8443 } ip saddr @allowed_v4 accept
    tcp dport { 8080, 8443 } drop
  }
}
