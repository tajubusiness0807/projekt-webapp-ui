# Nur Bullseye: DHCP für das Fahrzeug-WLAN. Nach /etc/dnsmasq.d/allwheel.conf kopieren.
interface=wlan0
bind-interfaces
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,12h
# Kein Gateway/DNS nach außen ankündigen – das Netz bleibt isoliert
dhcp-option=3
dhcp-option=6
address=/allwheel.local/192.168.4.1
