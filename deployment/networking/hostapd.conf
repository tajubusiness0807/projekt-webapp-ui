# Nur für ältere Systeme ohne NetworkManager (Raspberry Pi OS Bullseye).
# Nach /etc/hostapd/hostapd.conf kopieren, SSID/Passwort anpassen; zusammen mit dnsmasq.conf und
# dhcpcd.conf.snippet verwenden (siehe docs/installation.md).
country_code=DE
interface=wlan0
ssid=AllWheel
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=BITTE_AENDERN_mind_12_Zeichen
ignore_broadcast_ssid=0
